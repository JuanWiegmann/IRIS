version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: kim-postgres
    environment:
      POSTGRES_USER: kim
      POSTGRES_PASSWORD: kim_dev_password
      POSTGRES_DB: kim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kim"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
